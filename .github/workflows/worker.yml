name: Deploy Cloudflare Worker

# Ручной запуск: Actions → Deploy Cloudflare Worker → Run workflow.
# Секреты репозитория: CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers»),
# CLOUDFLARE_ACCOUNT_ID (если аккаунтов несколько), SANTA_URL.
# Переменная репозитория: ALLOWED_ORIGINS.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cloudflare/wrangler-action@v4
        env:
          SANTA_URL: ${{ secrets.SANTA_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            SANTA_URL
            ALLOWED_ORIGINS

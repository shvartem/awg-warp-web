name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.mjs
      - run: node tests/worker.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write worker URL from repo variable
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Задайте переменную репозитория WORKER_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          node -e 'require("fs").writeFileSync("site/config.js", "export default " + JSON.stringify({ workerUrl: process.env.WORKER_URL.replace(/\/+$/, "") }) + ";\n")'
      - name: Add Content Security Policy (only the Worker is reachable)
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/csp.mjs site "$WORKER_URL"
      - name: Add version to script and style URLs (cache busting)
        run: node scripts/stamp.mjs site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
